# =============================================================================
# V3 Configuration — Florence-2 + CLIP ViT-L/14 + 5-frame patch tokens + flow
# =============================================================================
# Feature directory: data/features_florence2_vitl14_5f_patch/
# Checkpoint dir:    checkpoints_v3_florence2/
# Results dir:       results_v3_florence2/
#
# This config is a STANDALONE file for the V3 experiment.
# configs/config.yaml (baseline) is NEVER modified.
# Naming convention: features_[captioner]_[backbone]_[frames]_[token_type]

seed: 42

data:
  raw_dir: "data/raw"
  features_dir: "data/features_florence2_vitl14_5f_patch"   # unique V3 dir
  annotation_file: "data/Temporal_Anomaly_Annotation.txt"
  frame_extensions:
    - ".png"
    - ".jpg"

extraction:
  num_segments: 32
  frames_per_segment: 5                               # 5-frame temporal averaging
  clip_model_name: "openai/clip-vit-large-patch14"   # ViT-L/14 (768-dim)
  captioner: "florence2"                              # Florence-2-large
  florence2_model_name: "microsoft/florence-2-large"
  florence2_task: "<MORE_DETAILED_CAPTION>"           # Dense action-focused captions
  use_patch_tokens: true                              # Patch mean (spatial) not CLS
  extract_flow: true                                  # Optical flow magnitude
  image_size: 224
  extraction_batch_size: 8     # Reduced for ViT-L/14 VRAM safety

model:
  feature_dim: 768             # ViT-L/14 output dimension
  num_segments: 32
  num_heads: 8                 # 768 / 8 = 96 ✓
  num_layers: 1
  dropout: 0.5
  ff_dim: 3072                 # 4 × feature_dim (standard ratio)
  classifier_bottleneck_dim: 64
  classifier_hidden_dim: 128
  use_magnitude_branch: true
  use_flow_in_magnitude: false  # Disabled: 2-ch branch untested on surveillance footage; revert to 1-ch L2-norm

loss:
  # Adaptive Instance Selection (AIS)
  ais_score_threshold: 0.9
  ais_k_min: 3
  ais_warm_start_epochs: 20
  ais_warm_k: 8
  # Magnitude hinge — restored to 1e-2 (same as V2.2 which achieved 78.62%).
  # At 1e-3 the magnitude branch contributed <0.1% of total loss and failed to learn.
  lambda_magnitude: 1.0e-2
  margin_magnitude: 1.0
  # Antagonistic loss
  lambda_antagonistic: 1.0
  # Temporal smoothness (Phase 1)
  lambda_smooth: 8.0e-5

training:
  batch_size: 32
  learning_rate: 1.0e-4
  weight_decay: 5.0e-4
  epochs: 1000

  # Phase 1 scheduler: StepLR (stable for bag-level learning)
  lr_scheduler:
    type: "step"
    step_size: 400
    gamma: 0.1

  # Phase 2: constant LR (fixes the 5x-too-high LR problem from V2.2 CosineAnnealingLR)
  phase2_lr: 1.0e-5

  # MIST self-training — start earlier to give more Phase 2 epochs for localisation
  self_training_start_epoch: 300
  lambda_self: 0.5
  mist_pseudo_k: 3

  # Frame-level checkpoint saving — every epoch for full learning curve
  eval_frame_level_every: 1

  # Phase 2 smoothness override (allow MIST sharp score peaks)
  lambda_smooth_phase2: 1.0e-5

  # Gradient clipping
  gradient_clip_max_norm: 1.0

  # Logging — print batch stats every N batches
  log_interval: 10

  # Unique directories per experiment
  checkpoint_dir: "checkpoints_v3_florence2"

evaluation:
  results_dir: "results_v3_florence2"
