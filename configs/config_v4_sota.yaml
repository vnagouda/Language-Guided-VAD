# =============================================================================
# V4 SOTA Configuration — BLIP-2 VQA + Multi-Scale Cross-Attention +
#                          Feature Contrastive Loss + Normal Memory Bank
# =============================================================================
# Features:  data/features_v31_blip2_prompt/  (same as V3.1 — no re-extraction)
# Checkpoints: checkpoints_v4/
# Results:     results_v4/
#
# V4 over V3.1 (HPO-best):
#   - use_multi_scale: true  (3-scale temporal attention, +2-3% expected)
#   - memory_bank_size: 256  (global normal FIFO bank, +1-2% expected)
#   - lambda_contrastive: 0.08  (feature-space separation loss)
#   - lambda_bank: 0.04         (memory bank contrastive loss)
#   - Optimizer: AdamW (decoupled weight decay)
# =============================================================================

seed: 42

data:
  raw_dir: "data/raw"
  features_dir: "data/features_v31_blip2_prompt"   # Reuses V3.1 BLIP-2 features
  annotation_file: "data/Temporal_Anomaly_Annotation.txt"
  frame_extensions:
    - ".png"
    - ".jpg"

extraction:
  num_segments: 32
  frames_per_segment: 5
  clip_model_name: "openai/clip-vit-large-patch14"
  captioner: "blip2"
  blip2_model_name: "Salesforce/blip2-opt-2.7b"
  blip2_prompt: "Question: What is happening in this image? Answer:"
  use_patch_tokens: true
  extract_flow: true
  image_size: 224
  extraction_batch_size: 4

model:
  feature_dim: 768
  num_segments: 32
  num_heads: 8
  num_layers: 1
  dropout: 0.4843           # Optimal from V3.1 HPO
  ff_dim: 3072
  classifier_bottleneck_dim: 64
  classifier_hidden_dim: 128
  use_magnitude_branch: true
  use_flow_in_magnitude: false
  use_multi_scale: true     # V4: Multi-Scale Cross-Attention (3 scales: T=32,16,8)
  memory_bank_size: 256     # V4: FIFO bank of normal guided features

loss:
  # AIS parameters (unchanged from HPO-optimal)
  ais_score_threshold: 0.9
  ais_k_min: 3
  ais_warm_start_epochs: 20
  ais_warm_k: 8

  # Magnitude branch
  margin_magnitude: 1.0
  lambda_magnitude: 0.01918   # Optimal from V3.1 HPO

  # Antagonistic loss
  lambda_antagonistic: 2.5755   # Optimal from V3.1 HPO

  # Temporal smoothness
  lambda_smooth: 1.093e-05   # Optimal from V3.1 HPO

  # V4: Feature Contrastive Loss (MGFN-inspired embedding-space separation)
  lambda_contrastive: 0.08
  margin_contrastive: 2.0

  # V4: Memory Bank Contrastive Loss (Cross-Batch ICME 2023)
  lambda_bank: 0.04
  margin_bank: 2.0

training:
  batch_size: 1024
  epochs: 1000
  learning_rate: 0.00014460    # Optimal from V3.1 HPO
  weight_decay: 0.0008827      # Optimal from V3.1 HPO

  lr_scheduler:
    type: "step"
    step_size: 400
    gamma: 0.1

  gradient_clip_max_norm: 5.0
  self_training_start_epoch: 50    # Phase-1 peaks here; MIST prevents MIL overfitting from ep50
  lambda_self: 0.03                  # Very gentle: MIST is a regularizer, not an override
  mist_pseudo_k: 2                   # Tight top-2 only: very selective pseudo-labels
  phase2_lr: 1.446e-05             # 10% of peak LR
  log_interval: 10
  checkpoint_dir: "checkpoints_v4"
  eval_frame_level_every: 1
  lambda_smooth_phase2: 1.0e-05

evaluation:
  results_dir: "results_v4"
