# =============================================================================
# V3.1 Configuration — BLIP-2 Prompting + CLIP ViT-L/14 + 5-frame + flow
# =============================================================================
# Feature directory: data/features_v31_blip2_prompt/
# Checkpoint dir:    checkpoints_v31/
# Results dir:       results_v31/
#
# This config tests the hypothesis that explicitly prompting a VLM helps it
# attend to anomalous actions over static background scenes.

seed: 42

data:
  raw_dir: "data/raw"
  features_dir: "data/features_v31_blip2_prompt"   # unique V3.1 dir
  annotation_file: "data/Temporal_Anomaly_Annotation.txt"
  frame_extensions:
    - ".png"
    - ".jpg"

extraction:
  num_segments: 32
  frames_per_segment: 5                               # 5-frame temporal averaging
  clip_model_name: "openai/clip-vit-large-patch14"    # ViT-L/14 (768-dim)
  captioner: "blip2"                                  # Switch to BLIP-2
  blip2_model_name: "Salesforce/blip2-opt-2.7b"
  blip2_prompt: "Question: What is happening in this image? Answer:"
  use_patch_tokens: true                              # Patch mean (spatial) not CLS
  extract_flow: true                                  # Optical flow magnitude
  image_size: 224
  extraction_batch_size: 4     # Reduced due to FP32 BLIP-2 requirement

model:
  feature_dim: 768             # ViT-L/14 output dimension
  num_segments: 32
  num_heads: 8                 # 768 / 8 = 96 ✓
  num_layers: 1
  dropout: 0.363328            # Tuned via V3 HPO (Trial 18)
  ff_dim: 3072                 # 4 × feature_dim
  classifier_bottleneck_dim: 64
  classifier_hidden_dim: 128
  use_magnitude_branch: true
  use_flow_in_magnitude: false  # 1-ch L2-norm

training:
  batch_size: 1024
  epochs: 1000
  learning_rate: 0.0002089     # Tuned via V3 HPO
  weight_decay: 0.0002272      # Tuned via V3 HPO

  lr_scheduler:
    type: "step"
    step_size: 400
    gamma: 0.1
  gradient_clip_max_norm: 5.0
  self_training_start_epoch: 420  # Phase 2 start
  lambda_self: 0.7334          # Tuned via V3 HPO
  mist_pseudo_k: 5
  phase2_lr: 0.00002089        # Constant override (lr / 10)
  log_interval: 10
  checkpoint_dir: "checkpoints_v31"
  eval_frame_level_every: 1    # Generate a full curve again

loss:
  ais_score_threshold: 0.90
  ais_k_min: 3
  ais_warm_start_epochs: 20
  ais_warm_k: 8
  margin_magnitude: 1.0
  lambda_magnitude: 0.00524    # Tuned via V3 HPO
  lambda_antagonistic: 2.978   # Tuned via V3 HPO
  lambda_smooth: 1.489e-05     # Tuned via V3 HPO
  lambda_smooth_phase2: 1.0e-5 # Sharp peaks needed in Phase 2

evaluation:
  results_dir: "results_v31"
