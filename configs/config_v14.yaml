# =============================================================================
# V14 Configuration — Tri-Modal Late Fusion, Fine-tuned from V12
# =============================================================================
# Same architecture as V13 Revised, but warm-started from V12 best checkpoint.
# Option A: Only train on videos with both CLIP and I3D features (no bias).
# Checkpoints: checkpoints_v14/
# Results:     results_v14/
#
# Strategy:
#   - Late fusion: I3D injected AFTER cross-attention via attention gate
#   - LayerNorm on I3D projection for distribution alignment
#   - 4-channel enhanced magnitude branch (CLIP + flow + I3D + Δi3d)
#   - Temporal difference features for anomaly onset detection
#   - Cross-attention operates on PURE CLIP (identical to V12)
# =============================================================================

seed: 42

data:
  raw_dir: "data/raw"
  features_dir: "data/features_v12_T128"
  i3d_dir: "data/features_v13_i3d"
  annotation_file: "data/Temporal_Anomaly_Annotation.txt"
  require_i3d: true                # Option A: skip videos without I3D
  frame_extensions:
    - ".png"
    - ".jpg"

extraction:
  num_segments: 128
  frames_per_segment: 5
  clip_model_name: "openai/clip-vit-large-patch14"
  source_text_features: "data/features_v31_blip2_prompt"
  use_patch_tokens: true
  extract_flow: true
  image_size: 224

model:
  feature_dim: 768
  num_segments: 128
  num_heads: 8
  num_layers: 1
  dropout: 0.4843                 # V5 HPO optimal
  ff_dim: 3072
  classifier_bottleneck_dim: 64
  classifier_hidden_dim: 128
  use_magnitude_branch: true
  use_multi_scale: true           # V4: proven multi-scale cross-attention
  memory_bank_size: 256
  num_prototypes: 16

  # V13 Revised: Tri-Modal Late Fusion
  use_i3d_fusion: true
  i3d_dim: 1024                   # 1024-dim RGB-only I3D features
  use_i3d_in_magnitude: true      # 4-channel magnitude branch
  use_i3d_temporal_diff: true     # Δi3d temporal difference features

loss:
  # AIS parameters — V5 HPO optimal
  ais_score_threshold: 0.9
  ais_k_min: 20
  ais_warm_start_epochs: 20
  ais_warm_k: 48

  # Magnitude branch — V5 HPO optimal
  lambda_magnitude: 0.01918
  margin_magnitude: 1.0

  # Antagonistic loss
  lambda_antagonistic: 2.5755

  # Temporal smoothness
  lambda_smooth: 1.093e-05

  # Prototype losses DISABLED
  lambda_prototype_cluster: 0.0
  lambda_prototype_sep: 0.0
  margin_prototype: 2.0

  # Feature Contrastive + Memory Bank
  lambda_contrastive: 0.08
  margin_contrastive: 2.0
  lambda_bank: 0.04
  margin_bank: 2.0

  # SCL disabled
  lambda_snippet_contrastive: 0.0
  snippet_margin: 2.0

training:
  batch_size: 256
  num_workers: 4
  epochs: 500
  learning_rate: 0.00001           # Fine-tune LR (10x lower than from-scratch)
  weight_decay: 0.0008827

  lr_scheduler:
    type: "cosine_warm"
    T_0: 30
    T_mult: 2
    eta_min: 1.0e-7

  class_balanced_sampling: true

  gradient_clip_max_norm: 5.0
  checkpoint_dir: "checkpoints_v14"

  # Warm-start from V12 best checkpoint
  pretrained_checkpoint: "checkpoints_v12/best_model_framelevel.pth"

  # MIST config
  self_training_start_epoch: 10    # Earlier MIST: backbone is pre-trained
  lambda_self: 0.05
  mist_pseudo_k: 12
  log_interval: 10
  eval_frame_level_every: 1
  lambda_smooth_phase2: 1.0e-05

evaluation:
  results_dir: "results_v14"
