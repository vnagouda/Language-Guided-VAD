# =============================================================================
# V17 Configuration — V12 (seed 777) with NO MIST
# =============================================================================
# Uses the PROVEN 02_train.py script, NOT 02_train_v17.py.
# Only change: self_training_start_epoch set beyond total epochs.
# This cleanly tests whether MIST hurts or helps.
# =============================================================================

seed: 777

data:
  raw_dir: "data/raw"
  features_dir: "data/features_v12_T128"
  annotation_file: "data/Temporal_Anomaly_Annotation.txt"
  frame_extensions:
    - ".png"
    - ".jpg"

extraction:
  num_segments: 128
  frames_per_segment: 5
  clip_model_name: "openai/clip-vit-large-patch14"
  source_text_features: "data/features_v31_blip2_prompt"
  use_patch_tokens: true
  extract_flow: true
  image_size: 224

model:
  feature_dim: 768
  num_segments: 128
  num_heads: 8
  num_layers: 1
  dropout: 0.4843                 # V5 HPO optimal — PROVEN
  ff_dim: 3072
  classifier_bottleneck_dim: 64
  classifier_hidden_dim: 128
  use_magnitude_branch: true
  use_flow_in_magnitude: false
  use_multi_scale: true
  use_temporal_convolutions: false
  memory_bank_size: 256
  num_prototypes: 16

loss:
  ais_score_threshold: 0.9
  ais_k_min: 20
  ais_warm_start_epochs: 20
  ais_warm_k: 48

  lambda_magnitude: 0.01918
  margin_magnitude: 1.0

  lambda_antagonistic: 2.5755
  lambda_smooth: 1.093e-05

  lambda_prototype_cluster: 0.0
  lambda_prototype_sep: 0.0
  margin_prototype: 2.0

  lambda_contrastive: 0.08
  margin_contrastive: 2.0
  lambda_bank: 0.04
  margin_bank: 2.0

  lambda_snippet_contrastive: 0.0
  snippet_margin: 2.0

training:
  batch_size: 256
  num_workers: 4
  epochs: 300                       # Pure Phase 1, no MIST waste
  learning_rate: 0.00014460
  weight_decay: 0.0008827

  lr_scheduler:
    type: "cosine_warm"
    T_0: 50                         # Same as V12 — PROVEN
    T_mult: 2
    eta_min: 1.0e-6

  class_balanced_sampling: true
  gradient_clip_max_norm: 5.0
  checkpoint_dir: "checkpoints_v17"

  # MIST DISABLED — start epoch set beyond total epochs
  self_training_start_epoch: 9999
  lambda_self: 0.05
  mist_pseudo_k: 12
  log_interval: 10
  eval_frame_level_every: 1
  lambda_smooth_phase2: 1.0e-05

evaluation:
  results_dir: "results_v17"
