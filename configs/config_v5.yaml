# =============================================================================
# V5 Configuration — All V4 improvements + Training Strategy Upgrades
# =============================================================================
# Changes over V4:
#   - CosineAnnealingWarmRestarts LR scheduler (replaces brittle StepLR)
#   - topk: 5 (was 1 — more gradient signal, less noise sensitivity)
#   - Class-balanced sampling (inverse-frequency weights per anomaly category)
#   - Higher learning rate warmup before MIST (start MIST at epoch 60)
#   - Slightly stronger temperature for MIST (lambda_self: 0.05)
#   - mist_pseudo_k: 3 (was 2 — slightly more pseudo-label coverage)
#   - Checkpoints in checkpoints_v5/ to not overwrite V4 best
# =============================================================================

seed: 42

data:
  raw_dir: "data/raw"
  features_dir: "data/features_v31_blip2_prompt"   # Same BLIP-2 features as V4
  annotation_file: "data/Temporal_Anomaly_Annotation.txt"
  frame_extensions:
    - ".png"
    - ".jpg"

extraction:
  num_segments: 32
  frames_per_segment: 5
  clip_model_name: "openai/clip-vit-large-patch14"
  captioner: "blip2"
  blip2_model_name: "Salesforce/blip2-opt-2.7b"
  blip2_prompt: "Question: What is happening in this image? Answer:"
  use_patch_tokens: true
  extract_flow: true
  image_size: 224
  extraction_batch_size: 4

model:
  feature_dim: 768
  num_segments: 32
  num_heads: 8
  num_layers: 1
  dropout: 0.4843          # Optimal from V3.1 HPO
  ff_dim: 3072
  classifier_bottleneck_dim: 64
  classifier_hidden_dim: 128
  use_magnitude_branch: true
  use_flow_in_magnitude: false
  use_multi_scale: true    # V4+: Multi-Scale Cross-Attention
  memory_bank_size: 256    # V4+: FIFO normal feature bank

loss:
  # AIS parameters (Light-WVAD adaptive K)
  # Pushing minimum K from 3 to 5 for more stable gradients
  ais_score_threshold: 0.9
  ais_k_min: 5         # Enforces minimum 5 segments per video in MIL loss
  ais_warm_start_epochs: 20
  ais_warm_k: 12       # Initial warm K (was 8)

  # Magnitude branch
  margin_magnitude: 1.0
  lambda_magnitude: 0.01918

  # Antagonistic loss
  lambda_antagonistic: 2.5755

  # Temporal smoothness
  lambda_smooth: 1.093e-05

  # Feature Contrastive Loss
  lambda_contrastive: 0.08
  margin_contrastive: 2.0

  # Memory Bank Contrastive Loss
  lambda_bank: 0.04
  margin_bank: 2.0

training:
  batch_size: 1024
  epochs: 1000
  learning_rate: 0.00014460
  weight_decay: 0.0008827

  # V5 KEY CHANGE: CosineAnnealingWarmRestarts (replaces StepLR)
  # T_0=50 means first restart at epoch 50, then doubles each cycle
  # eta_min=1e-6 is the floor LR
  lr_scheduler:
    type: "cosine_warm"
    T_0: 50
    T_mult: 2
    eta_min: 1.0e-6

  # V5 KEY CHANGE: class_balanced_sampling
  # Uses inverse-frequency weighting per UCF-Crime anomaly category
  # e.g., Arrest (rare) gets higher sampling weight than Abuse (common)
  class_balanced_sampling: true

  gradient_clip_max_norm: 5.0

  # V5: Start MIST slightly later (60 vs 50) to let CosineAnnealing stabilise first
  self_training_start_epoch: 60
  lambda_self: 0.05         # Slightly stronger than V4's 0.03
  mist_pseudo_k: 3          # Was 2 — slightly more pseudo-label coverage
  phase2_lr: 1.446e-05
  log_interval: 10
  checkpoint_dir: "checkpoints_v5"
  eval_frame_level_every: 1
  lambda_smooth_phase2: 1.0e-05

evaluation:
  results_dir: "results_v5"
