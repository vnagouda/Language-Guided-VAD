# =============================================================================
# V16 Configuration — Early Fusion 1024-dim I3D + Full Training Set
# =============================================================================
# Same proven V12 architecture + simple early I3D fusion (like V13 original).
# NO Option A filtering — all 1610 train videos used (609 normals get zero I3D).
# Key insight: V13 early fusion (0.8377) > V14/V15 late fusion (0.8188-0.8225).
# Checkpoints: checkpoints_v16/
# Results:     results_v16/
# =============================================================================

seed: 42

data:
  raw_dir: "data/raw"
  features_dir: "data/features_v12_T128"
  i3d_dir: "data/features_v13_i3d"
  annotation_file: "data/Temporal_Anomaly_Annotation.txt"
  require_i3d: false               # NO filter — use all 1610 train videos
  frame_extensions:
    - ".png"
    - ".jpg"

extraction:
  num_segments: 128
  frames_per_segment: 5
  clip_model_name: "openai/clip-vit-large-patch14"
  source_text_features: "data/features_v31_blip2_prompt"
  use_patch_tokens: true
  extract_flow: true
  image_size: 224

model:
  feature_dim: 768
  num_segments: 128
  num_heads: 8
  num_layers: 1
  dropout: 0.4843
  ff_dim: 3072
  classifier_bottleneck_dim: 64
  classifier_hidden_dim: 128
  use_magnitude_branch: true
  use_multi_scale: true
  memory_bank_size: 256
  num_prototypes: 16

  # V16: Early Fusion I3D
  use_i3d_fusion: true
  i3d_dim: 1024
  i3d_fusion_type: "early_blend"    # Simple learned alpha blend BEFORE cross-attn
  use_i3d_in_magnitude: false       # Keep magnitude branch simple (2-channel)
  use_i3d_temporal_diff: false

loss:
  ais_score_threshold: 0.9
  ais_k_min: 20
  ais_warm_start_epochs: 20
  ais_warm_k: 48

  lambda_magnitude: 0.01918
  margin_magnitude: 1.0

  lambda_antagonistic: 2.5755
  lambda_smooth: 1.093e-05

  lambda_prototype_cluster: 0.0
  lambda_prototype_sep: 0.0
  margin_prototype: 2.0

  lambda_contrastive: 0.08
  margin_contrastive: 2.0
  lambda_bank: 0.04
  margin_bank: 2.0

  lambda_snippet_contrastive: 0.0
  snippet_margin: 2.0

training:
  batch_size: 256
  num_workers: 4
  epochs: 500
  learning_rate: 0.00014460
  weight_decay: 0.0008827

  lr_scheduler:
    type: "cosine_warm"
    T_0: 50
    T_mult: 2
    eta_min: 1.0e-6

  class_balanced_sampling: true
  gradient_clip_max_norm: 5.0
  checkpoint_dir: "checkpoints_v16"

  self_training_start_epoch: 60
  lambda_self: 0.05
  mist_pseudo_k: 12
  log_interval: 10
  eval_frame_level_every: 1
  lambda_smooth_phase2: 1.0e-05

evaluation:
  results_dir: "results_v16"
